<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"/>
<title>GymNotion</title>

<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<link rel="manifest" href="manifest.webmanifest?v=2"/>

     apple-touch-icon por muito tempo e ignora Cache-Control. Ao trocar o
     ícone, suba esse número aqui, no manifest e em sw.js. -->
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2"/>
<link rel="icon" href="icons/icon-192.png?v=2"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div id="app"></div>

<script>
  /* fallbacks para iOS mais antigos */
  if (typeof structuredClone !== 'function') {
    window.structuredClone = function (o) { return JSON.parse(JSON.stringify(o)); };
  }
</script>
<script src="js/exercises.js"></script>
<script src="js/exercise-images.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>

</html>
